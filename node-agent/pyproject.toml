[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-node-agent"
version = "1.2.0"
description = "No-KYC privacy VPN — node agent (RAM-only)"
requires-python = ">=3.11"  # node = Debian 12 (Python 3.11); the agent does not use 3.12-only syntax
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42",  # self-signed TLS for the control channel (RAM-only), H1
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"  # keep the agent 3.11-compatible (the node runs 3.11)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]  # line length is style, not a bug
