[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-control-plane"
version = "1.2.0"
description = "No-KYC privacy VPN — control plane (источник правды)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade. (B/SIM — a separate sweep.)
select = ["E", "W", "F", "I", "UP"]
# E501 (line length) — style, not a bug; there are many long comments and table-shaped definitions
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations: boilerplate style (imports/strings) — we leave generated code alone
"migrations/*" = ["E", "F", "I", "UP"]
