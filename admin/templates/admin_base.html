<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Админка{% endblock %} — privacyvpn</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin">
<a class="skip" href="#main">К содержимому</a>
{% set path = request.url.path %}
<header class="topbar">
  <a class="wordmark" href="{{ admin_path }}" aria-label="privacyvpn · админка">
    <span class="wm-1">privacy</span><span class="wm-dot">·</span><span class="wm-2"><span>v</span><span>p</span><span>n</span></span>
  </a>
  <nav class="topbar__nav" aria-label="Админка">
    <a href="{{ admin_path }}"{% if path == admin_path %} aria-current="page"{% endif %}>Дашборд</a>
    <a href="{{ admin_path }}/plans"{% if path.startswith(admin_path + '/plans') %} aria-current="page"{% endif %}>Тарифы</a>
    <a href="{{ admin_path }}/promos"{% if path.startswith(admin_path + '/promos') %} aria-current="page"{% endif %}>Промокоды</a>
    <a href="{{ admin_path }}/gifts"{% if path.startswith(admin_path + '/gifts') %} aria-current="page"{% endif %}>Гифты</a>
    <a href="{{ admin_path }}/nodes"{% if path.startswith(admin_path + '/nodes') %} aria-current="page"{% endif %}>Ноды</a>
    <a href="{{ admin_path }}/accounts"{% if path.startswith(admin_path + '/accounts') %} aria-current="page"{% endif %}>Аккаунты</a>
    <a href="{{ admin_path }}/invoices"{% if path.startswith(admin_path + '/invoices') %} aria-current="page"{% endif %}>Инвойсы</a>
  </nav>
  <div class="topbar__spacer"></div>
  <div class="topbar__actions">
    <button class="icon-btn" type="button" data-theme-toggle aria-pressed="false" aria-label="Переключить тему">◐</button>
    <a class="btn btn--ghost btn--sm" href="{{ admin_path }}/logout">Выход</a>
  </div>
</header>

<main id="main" class="container">
{% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="footer__legal" style="border:0;justify-content:center;color:var(--ink-3)">
    privacyvpn · операторская консоль · без внешних ресурсов · работает без JavaScript
  </div>
</footer>

<script src="{{ url_for('static', filename='app.js') }}" defer></script>
<script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</body>
</html>
