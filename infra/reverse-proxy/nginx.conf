# Reverse proxy for the control-plane. THE POINT: an access log with NO client IP (no-logs policy).
# Checked in CI: the config must not contain $remote_addr / $http_x_forwarded_for in any log.

worker_processes auto;
events { worker_connections 1024; }

http {
    # log format without the client IP address and without X-Forwarded-For
    log_format no_ip '"$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log no_ip;
    # or, if preferred, drop it entirely: access_log off;

    server {
        listen 80;
        server_name _;

        # the real IP is NOT forwarded upstream (the CP does not log it, and does not receive it either)
        location / {
            proxy_pass http://control-plane:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";   # do not pass the client IP through
            proxy_set_header X-Real-IP "";
            proxy_hide_header X-Powered-By;
        }
    }
}
