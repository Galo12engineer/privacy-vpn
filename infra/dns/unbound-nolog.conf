# Per-node resolver WITHOUT query logging. RAM-only. Deployed PER-NODE,
# so that DNS of all users is not collected in a single correlation point.
server:
    interface: @DNS_LISTEN_IP@
    # wg0 (carries @DNS_LISTEN_IP@) is brought up by the agent LATER than unbound and after reboot;
    # ip-freebind allows binding to a not-yet-existing address (otherwise fatal at startup).
    ip-freebind: yes
    access-control: 10.0.0.0/8 allow
    access-control: fd00::/8 allow
    access-control: 127.0.0.0/8 allow

    # --- no-logs ---
    verbosity: 0
    use-syslog: no
    logfile: ""
    log-queries: no
    log-replies: no
    log-servfail: no
    statistics-interval: 0
    extended-statistics: no

    # privacy / hardening
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    rrset-roundrobin: yes
    do-ip6: yes
    prefetch: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400

    # we resolve ourselves from the root servers (no third-party DNS that could log)
    # if needed, replace with a forward-zone to a trusted DoT provider
